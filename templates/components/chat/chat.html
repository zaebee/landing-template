<section
  data-sads-component="chat"
  data-sads-padding="l"
  data-sads-bg-color="chat-widget-bg"
  data-sads-border-radius="l"
  data-sads-shadow="medium"
  data-sads-border-width="custom:1px"
  data-sads-border-style="solid"
  data-sads-border-color="chat-widget-border-color"
  data-sads-font-family="sans"
  data-sads-max-width="custom:450px"
  data-sads-margin="custom:xl auto"
>
  <div
    data-sads-element="chat-container"
    data-sads-display="flex"
    data-sads-flex-direction="column"
    data-sads-gap="m"
    data-sads-padding="m"
  >
    <div
      id="chat-messages-list"
      data-sads-element="messages"
      data-sads-padding="m"
      data-sads-bg-color="surface"
      data-sads-dark-bg-color="chat-message-area-bg-dark"
      data-sads-border-radius="m"
      data-sads-min-height="custom:250px"
      data-sads-max-height="custom:400px"
      data-sads-shadow="subtle"
      data-sads-overflow-y="auto"
      data-sads-display="flex"
      data-sads-flex-direction="column"
      data-sads-gap="s"
    >
      <!--
        Dynamically added messages would look something like this:
        <div class="message user-message"
             data-sads-bg-color="chat-user-message-bg"
             data-sads-dark-bg-color="chat-user-message-bg-dark"
             data-sads-text-color="text-primary"
             data-sads-dark-text-color="text-primary-dark"
             data-sads-padding="s"
             data-sads-border-radius="m"
             data-sads-margin-bottom="s"
             data-sads-align-self="flex-end"
             data-sads-max-width="custom:80%">
          <p data-sads-margin="none" data-sads-font-size="m">User message content here.</p>
          <span data-sads-font-size="s" data-sads-text-color="text-secondary" data-sads-dark-text-color="text-secondary-dark" data-sads-display="block" data-sads-text-align="right">10:00 AM</span>
        </div>
        <div class="message other-message"
             data-sads-bg-color="chat-other-message-bg"
             data-sads-dark-bg-color="chat-other-message-bg-dark"
             data-sads-text-color="text-primary"
             data-sads-dark-text-color="text-primary-dark"
             data-sads-padding="s"
             data-sads-border-radius="m"
             data-sads-margin-bottom="s"
             data-sads-align-self="flex-start"
             data-sads-max-width="custom:80%">
          <p data-sads-margin="none" data-sads-font-size="m">Other message content here.</p>
          <span data-sads-font-size="s" data-sads-text-color="text-secondary" data-sads-dark-text-color="text-secondary-dark" data-sads-display="block" data-sads-text-align="left">10:01 AM</span>
        </div>
      -->
    </div>
    <form
      id="chat-form"
      data-sads-element="input-form"
      data-sads-display="flex"
      data-sads-gap="s"
      data-sads-align-items="center"
    >
      <input
        id="chat-message-input"
        data-sads-element="input"
        type="text"
        placeholder="Type a message..."
        data-sads-flex="custom:1"
        data-sads-padding="s m"
        data-sads-font-size="m"
        data-sads-border-radius="m"
        data-sads-border-color="input-border-color"
        data-sads-dark-border-color="input-border-color-dark"
        data-sads-border-width="custom:1px"
        data-sads-border-style="solid"
        data-sads-bg-color="input-bg-color"
        data-sads-dark-bg-color="input-bg-color-dark"
        data-sads-text-color="text-primary"
        data-sads-dark-text-color="text-primary-dark"
      />
      <button
        id="chat-send-button"
        data-sads-element="send-btn"
        type="submit"
        data-sads-bg-color="button-primary-bg-color"
        data-sads-dark-bg-color="button-primary-bg-color-dark"
        data-sads-text-color="button-primary-text-color"
        data-sads-dark-text-color="button-primary-text-color"
        data-sads-padding="s m"
        data-sads-font-size="m"
        data-sads-border-radius="m"
        data-sads-cursor="pointer"
        data-sads-border-width="custom:1px"
        data-sads-border-style="solid"
        data-sads-border-color="transparent"
      >
        Send
      </button>
    </form>
  </div>
</section>
