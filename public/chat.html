<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      content="Dedicated page for Chat and MCP IDE Agent Panel components."
      name="description"
    />
    <title>Chat & MCP Panel</title>
    <link href="/public/dist/assets/style.css" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "@protobuf-ts/runtime": "https://esm.sh/@protobuf-ts/runtime@2.9.4"
        }
      }
    </script>
  </head>
  <body>
    <section
      data-sads-component="chat"
      data-sads-padding="xl"
      data-sads-bg-color="chat-bg"
    >
      <div
        data-sads-element="chat-container"
        data-sads-max-width="custom:400px"
        data-sads-margin="custom:0 auto"
        data-sads-display="flex"
        data-sads-flex-direction="column"
        data-sads-gap="m"
      >
        <div
          id="chat-messages-list"
          data-sads-element="messages"
          data-sads-padding="m"
          data-sads-bg-color="chat-messages-bg"
          data-sads-border-radius="m"
          data-sads-min-height="custom:200px"
          data-sads-shadow="subtle"
          data-sads-overflow-y="auto"
          data-sads-display="flex"
          data-sads-flex-direction="column"
          data-sads-gap="s"
        >
          <!-- Messages will be dynamically inserted here -->
        </div>
        <form
          id="chat-form"
          data-sads-element="input-form"
          data-sads-display="flex"
          data-sads-gap="s"
        >
          <input
            id="chat-message-input"
            data-sads-element="input"
            type="text"
            placeholder="Type a message..."
            data-sads-flex="custom:1"
            data-sads-padding="s"
            data-sads-border-radius="s"
            data-sads-border-color="input-border-color"
            data-sads-border-width="custom:1px"
            data-sads-border-style="solid"
            data-sads-bg-color="input-bg-color"
          />
          <button
            id="chat-send-button"
            data-sads-element="send-btn"
            type="submit"
            data-sads-bg-color="button-primary-bg-color"
            data-sads-text-color="button-primary-text-color"
            data-sads-padding="s m"
            data-sads-border-radius="s"
            data-sads-cursor="pointer"
          >
            Send
          </button>
        </form>
      </div>
    </section>

    <!-- templates/components/ide_agent_panel/ide_agent_panel.html -->
    <div
      data-sads-component="ide-agent-panel"
      data-sads-scope="ide-agent-panel-scope"
      data-sads-layout-type="flex"
      data-sads-flex-direction="column"
      data-sads-padding="m"
      data-sads-gap="m"
      data-sads-border="custom:1px_solid_neutral-border"
      data-sads-bg-color="bg-default"
      data-sads-width="custom:400px"
      data-sads-height="custom:600px"
      data-sads-text-color="text-primary"
    >
      <h2 data-sads-typography="heading-m" data-sads-margin-bottom="s">
        ElizaOS Agent Interaction
      </h2>

      <div
        data-sads-element="status-area"
        data-sads-padding="s"
        data-sads-bg-color="bg-subtle"
        data-sads-border-radius="s"
        data-sads-min-height="custom:40px"
        data-sads-text-color="text-secondary"
      >
        Status: Not Connected
      </div>

      <div
        data-sads-layout-type="flex"
        data-sads-flex-direction="column"
        data-sads-gap="s"
      >
        <label for="agent-id-input" data-sads-typography="label-default"
          >Target Agent ID (e.g., jules, eddy):</label
        >
        <input
          type="text"
          id="agent-id-input"
          data-sads-element="agent-id-input"
          value="jules"
          data-sads-input-bg-color="bg-input"
          data-sads-input-text-color="text-input"
          data-sads-input-border="custom:1px_solid_neutral-border"
          data-sads-padding="s"
          data-sads-border-radius="s"
        />
      </div>

      <div
        data-sads-layout-type="flex"
        data-sads-flex-direction="column"
        data-sads-gap="s"
      >
        <label for="code-snippet-input" data-sads-typography="label-default"
          >Code Snippet / Input:</label
        >
        <textarea
          id="code-snippet-input"
          data-sads-element="code-snippet-input"
          rows="8"
          data-sads-input-bg-color="bg-input"
          data-sads-input-text-color="text-input"
          data-sads-input-border="custom:1px_solid_neutral-border"
          data-sads-padding="s"
          data-sads-font-family="monospace"
          data-sads-border-radius="s"
        ></textarea>
      </div>

      <div
        data-sads-layout-type="flex"
        data-sads-flex-direction="column"
        data-sads-gap="s"
      >
        <label for="user-query-input" data-sads-typography="label-default"
          >Your Query / Request:</label
        >
        <input
          type="text"
          id="user-query-input"
          data-sads-element="user-query-input"
          value="Explain this code."
          data-sads-input-bg-color="bg-input"
          data-sads-input-text-color="text-input"
          data-sads-input-border="custom:1px_solid_neutral-border"
          data-sads-padding="s"
          data-sads-border-radius="s"
        />
      </div>

      <div
        data-sads-layout-type="flex"
        data-sads-gap="m"
        data-sads-flex-wrap="wrap"
      >
        <button
          data-sads-element="explain-code-button"
          data-sads-button-variant="primary"
          data-sads-padding-x="m"
          data-sads-padding-y="s"
        >
          Ask to Explain
        </button>
        <button
          data-sads-element="refactor-code-button"
          data-sads-button-variant="secondary"
          data-sads-padding-x="m"
          data-sads-padding-y="s"
        >
          Suggest Refactor
        </button>
      </div>

      <div
        data-sads-layout-type="flex"
        data-sads-flex-direction="column"
        data-sads-gap="s"
        data-sads-margin-top="m"
      >
        <h3 data-sads-typography="heading-s">Agent Response:</h3>
        <div
          data-sads-element="response-area"
          data-sads-padding="m"
          data-sads-bg-color="bg-subtle"
          data-sads-border="custom:1px_solid_neutral-border-soft"
          data-sads-min-height="custom:100px"
          data-sads-max-height="custom:300px"
          data-sads-overflow-y="auto"
          data-sads-border-radius="s"
          data-sads-text-color="text-primary"
          style="white-space: pre-wrap; word-wrap: break-word"
        >
          Awaiting response...
        </div>
      </div>
    </div>

    <script>
      // This config is used by the SADS WASM loader if it's initialized.
      // If app.ts handles all SADS initialization (like SADS V2),
      // some of these might be less critical for a standalone page,
      // but including for consistency with base.html.
      window.sadsConfig = {
        sadsPocWasmPath: "/public/dist/assets/wasm/sads_poc.wasm", // Adjusted path
        wasmExecPath: "/public/dist/assets/wasm/wasm_exec.js",     // Adjusted path
        // sadsDefaultThemePath and sadsEnginePath are typically not loaded this way
        // if sadsManager in app.ts directly imports and initializes the theme and engine.
        // For SADS V2, these might not be used from window.sadsConfig by app.ts.
        sadsDefaultThemePath: "", // Placeholder, app.ts imports theme directly
        sadsEnginePath: "",       // Placeholder, app.ts imports engine directly
      };
    </script>
    <script type="module" src="/public/dist/assets/js/app.js" defer></script>
  </body>
</html>
