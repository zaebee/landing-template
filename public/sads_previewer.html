<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SADS Component Previewer</title>

      /* Styles for #component-container (iframe approach) and placeholder - keep if relevant, or remove if iframe not used */
      #component-container iframe {
        width: 100%;
        height: 100%; /* Adjust as needed, or make it dynamic */
        border: 1px dashed #ddd;
      }
      #component-container:empty::before {
        content: "Select a component to preview";
        display: block;
        text-align: center;
        padding: 50px;
        color: #aaa;
        font-style: italic;
      }

      /* .component-render-target {
        width: 100%;
        min-height: 300px;
        border: 1px solid #ccc;
        overflow: auto;
      } */ /* Handled by SADS */

      /* Minimal body style if needed, though SADS on container should cover most */
      body {
        font-family: sans-serif; /* Fallback if SADS font isn't applied or top-level container doesn't set it */
        margin: 0; /* Good to keep as a base reset */
      }
    </style>
    <!-- SADS specific styles - these are needed for the components themselves -->
    <link rel="stylesheet" href="/style.css" />
    <!-- Main site styles, might contain useful defaults -->

    <!-- SADS Engine and Theme - these will be used by components rendered in the previewer -->
    <!-- These paths need to be valid when sads_previewer.html is served -->
    <!-- The SADS engine will inject its styles into the head of this document -->
  </head>
  <body>
    <div
      id="sads-previewer-container"
      data-sads-component="sads-previewer-layout"
      data-sads-display="flex"
      data-sads-flex-direction="column"
      data-sads-height="custom:100vh"
      data-sads-font-family="custom:sans-serif"
      data-sads-margin="custom:0"
    >
      <div
        class="previewer-header"
        data-sads-bg-color="custom:#f0f0f0"
        data-sads-padding="custom:10px"
        data-sads-border-bottom-width="custom:1px"
        data-sads-border-bottom-style="solid"
        data-sads-border-bottom-color="custom:#ccc"
        data-sads-display="flex"
        data-sads-align-items="center"
      >
        <label for="component-selector" data-sads-margin-right="custom:10px"
          >Select Component:</label
        >
        <select
          id="component-selector"
          data-sads-padding="custom:5px"
          data-sads-font-size="custom:1em"
        >
          <option value="">-- Loading Components --</option>
        </select>
      </div>

      <div
        class="main-content"
        data-sads-display="flex"
        data-sads-flex-grow="custom:1"
        data-sads-overflow="hidden"
      >
        <div
          class="component-display-area"
          data-sads-flex-grow="custom:3"
          data-sads-padding="custom:20px"
          data-sads-overflow-y="auto"
          data-sads-border-right-width="custom:1px"
          data-sads-border-right-style="solid"
          data-sads-border-right-color="custom:#ccc"
          data-sads-bg-color="custom:#fff"
        >
          <h2>Preview:</h2>
          <div
            id="component-render-target"
            class="component-render-target"
            data-sads-width="custom:100%"
            data-sads-min-height="custom:300px"
            data-sads-border-width="custom:1px"
            data-sads-border-style="solid"
            data-sads-border-color="custom:#ccc"
            data-sads-overflow="auto"
          >
            <!-- Component HTML will be injected here by JS -->
          </div>
        </div>

        <div
          class="attributes-inspector-area"
          data-sads-flex-grow="custom:1"
          data-sads-padding="custom:20px"
          data-sads-overflow-y="auto"
          data-sads-bg-color="custom:#f9f9f9"
          data-sads-font-family="custom:monospace"
          data-sads-font-size="custom:0.9em"
        >
          <h3 data-sads-margin-top="custom:0">SADS Attributes Inspector</h3>
          <p>
            Click on an element in the preview to see its data-sads-*
            attributes.
          </p>
          <pre
            id="attributes-display"
            data-sads-white-space="pre-wrap"
            data-sads-word-break="break-all"
          >
No element selected.</pre
          >
        </div>
      </div>
    </div>
    <!-- SADS Engine scripts -->
    <!-- These must be loaded for SADS components to be styled -->
    <!-- Order might matter: theme first, then engine, then manager -->
    <script src="/js/public/ts/sads-default-theme.js" defer></script>
    <script src="/js/public/ts/sads-style-engine.js" defer></script>
    <script src="/js/public/ts/modules/sadsManager.js" defer></script>
    <!-- Previewer specific JavaScript -->
    <script src="/js/public/ts/sadsPreviewer.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const previewerRootElement = document.getElementById(
          "sads-previewer-container"
        );
        if (previewerRootElement && typeof SadsPreviewerApp === "function") {
          new SadsPreviewerApp(previewerRootElement);
        } else {
          if (!previewerRootElement)
            console.error(
              "SADS Previewer root element (#sads-previewer-container) not found."
            );
          if (typeof SadsPreviewerApp !== "function")
            console.error(
              "SadsPreviewerApp class not found. Ensure sadsPreviewer.js is loaded and SadsPreviewerApp is globally available."
            );
          // Fallback or error display for the user
          const body = document.querySelector("body");
          if (body) {
            body.innerHTML =
              '<p style="color: red; font-family: sans-serif; padding: 20px;">Critical Error: SADS Previewer application could not be initialized. Check console for details.</p>';
          }
        }
      });
    </script>
  </body>
</html>
