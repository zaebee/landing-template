# Task Flow Definition for Generating SADS from Natural Language
# Version: 1.0.0
# Author: Jules (AI Agent)

id: mcp-generate-sads-from-nl-flow
version: "1.0.0"
name: "MCP Task: Generate SADS from Natural Language"
description: "Handles an MCP task request to generate a Structured Architectural Description Schema (SADS) from a natural language input by calling an internal API."
author: "Jules (AI Agent)"
creation_timestamp: "2024-07-15T10:00:00Z"

trigger:
  id: trigger-mcp-sads-nl-request
  type: MCPMessage
  description: "Triggers on MCP TASK_REQUEST for SADS generation from NL."
  filter_criteria:
    ontology_pattern: "elizaos:lpg:generate_sads_from_nl" # User-defined ontology for this specific task
    performative: "TASK_REQUEST"
  outputs:
    - source_path: "Message.Sender.AgentId"
      data_element_id: original_requester_agent_id
      description: "Captures the original sender's agent ID."
    - source_path: "Message.MessageId"
      data_element_id: original_mcp_message_id
      description: "Captures the original MCP message ID for replies."
    - source_path: "Message.TaskRequestPayload.TaskParameters" # This is a structpb.Struct
      data_element_id: mcp_task_parameters_struct
      description: "The task_parameters field from the MCP message."

data_elements:
  - id: original_requester_agent_id
    name: "Original Requester Agent ID"
    data_type: string
    description: "The agent ID of the MCP client that sent the request."
  - id: original_mcp_message_id
    name: "Original MCP Message ID"
    data_type: string
    description: "The message ID of the incoming MCP request."
  - id: mcp_task_parameters_struct
    name: "MCP Task Parameters"
    data_type: google.protobuf.Struct
    description: "Parameters provided in the task request, expected to contain the natural language input."
  - id: natural_language_input_string
    name: "Natural Language Input"
    data_type: string
    description: "The extracted natural language text."
  - id: api_request_json_string
    name: "API Request JSON"
    data_type: json_object_string # Stringified JSON
    description: "JSON payload for the internal /api/generate-sads-from-nl call."
    schema_definition: |
      {
        "type": "object",
        "properties": {
          "natural_language_prompt": { "type": "string" }
        },
        "required": ["natural_language_prompt"]
      }
  - id: internal_api_response_bytes
    name: "Internal API Response Body"
    data_type: bytes # Raw bytes from HTTP response
  - id: internal_api_response_status_code
    name: "Internal API Response Status Code"
    data_type: integer
  - id: sads_output_struct # This will be a structpb.Struct for MCP result_details
    name: "SADS Output Structure"
    data_type: google.protobuf.Struct
    description: "The SADS data generated by the API, formatted as a struct for MCP."
  - id: error_details_struct
    name: "Error Details Structure"
    data_type: google.protobuf.Struct
    description: "Error information formatted as a struct for MCP Failure payload."
  - id: mcp_service_agent_id # Constant or configured value
    name: "MCP Service Agent ID"
    data_type: string
    description: "The agent ID of this MCP service (e.g., 'jules')."
    # This could also be a global/flow-level constant. For now, as a data element.

stages:
  # 0. Initialize MCP Service Agent ID (example of setting a constant)
  - id: init-mcp-service-agent-id
    name: "Initialize Service Agent ID"
    stage_type: Transformation # Using transformation to set a value
    description: "Sets the MCP service's agent ID."
    outputs:
      - data_element_id: mcp_service_agent_id
        produced_as: value
    transform_engine: custom_code_snippet # Or a simple value assignment engine
    transform_logic:
      language: static_value
      value: "jules" # The agent ID of this service

  # 1. Extract Natural Language from Task Parameters
  - id: extract-nl-from-params
    name: "Extract Natural Language Input"
    stage_type: Transformation
    description: "Extracts 'natural_language_input' field from the MCP task_parameters struct."
    dependencies: [] # Depends on trigger
    inputs:
      - data_element_id: mcp_task_parameters_struct
        as_name: params_struct
    outputs:
      - data_element_id: natural_language_input_string
        produced_as: nl_text
    transform_engine: custom_code_snippet # Placeholder for logic to get field from structpb.Struct
    transform_logic:
      language: go_snippet # Pseudo-code for what needs to happen
      code: |
        // nl_text = params_struct.Fields["natural_language_input"].GetStringValue()
        // Add error handling if field is missing or wrong type.
        if val, ok := params_struct.Fields["natural_language_input"]; ok {
          nl_text = val.GetStringValue()
        } else {
          // ERROR: missing 'natural_language_input'
          // This should ideally trigger an error path defined in on_error
        }
    on_error:
      - error_pattern: "*" # Catch any error from this stage
        action: ProceedToStage
        action_params:
          next_stage_id: prepare-extraction-failure-response # Go to a failure prep stage

  # 2. Construct JSON request for the internal API
  - id: construct-api-request
    name: "Construct API Request JSON"
    stage_type: Transformation
    description: "Creates the JSON payload for the /api/generate-sads-from-nl API."
    dependencies:
      - extract-nl-from-params
    inputs:
      - data_element_id: natural_language_input_string
        as_name: nl_input
    outputs:
      - data_element_id: api_request_json_string
    transform_engine: custom_code_snippet # Placeholder for JSON construction
    transform_logic:
      language: go_snippet # Pseudo-code
      code: |
        // request_map := map[string]interface{}{"natural_language_prompt": nl_input}
        // api_request_json_string = json.MarshalToString(request_map)
        // Handle marshalling error
    on_error:
      - error_pattern: "*"
        action: ProceedToStage
        action_params:
          next_stage_id: prepare-apirequest-build-failure-response

  # 3. Call the internal API
  - id: call-internal-sads-api
    name: "Call Internal SADS Generation API"
    stage_type: ActionCall
    description: "Makes an HTTP POST request to the internal /api/generate-sads-from-nl endpoint."
    dependencies:
      - construct-api-request
    inputs:
      - data_element_id: api_request_json_string
        as_name: request_body
    outputs:
      - data_element_id: internal_api_response_bytes
        produced_as: response_body # How the action maps its result
      - data_element_id: internal_api_response_status_code
        produced_as: status_code
    action_type: HttpApiCall
    action_details:
      method: "POST"
      # URL needs port - assume serverPort is available as a flow context variable or pre-defined DataElement
      # For simplicity, hardcoding a placeholder. A real system needs this configurable.
      url_template: "http://localhost:{{flow_context.server_port}}/api/generate-sads-from-nl"
      headers:
        Content-Type: "application/json"
      request_body_data_element_id: api_request_json_string # Tells the action which input is the body
      response_mappings: # How to map HTTP response to outputs
        - source_path: "body" # Special keyword for response body
          data_element_id: internal_api_response_bytes
        - source_path: "statusCode" # Special keyword for status code
          data_element_id: internal_api_response_status_code
    on_error: # Network errors, non-2xx by default if not handled by decision point
      - error_pattern: "*"
        action: ProceedToStage
        action_params:
          next_stage_id: prepare-apicall-failure-response

  # 4. Decision Point: Check API Response Status
  - id: check-api-response-status
    name: "Check API Response Status"
    stage_type: DecisionPoint
    description: "Routes flow based on the API response status code."
    dependencies:
      - call-internal-sads-api
    inputs:
      - data_element_id: internal_api_response_status_code
        as_name: status
    decision_logic_engine: cel_expression # Common Expression Language
    branches:
      - condition: "status >= 200 && status < 300"
        next_stage_id: transform-api-response-to-mcp-result
        description: "API call was successful."
    default_branch_next_stage_id: prepare-apicall-failure-response # Any non-2xx status

  # 5. Transform successful API response to MCP InformResult details
  - id: transform-api-response-to-mcp-result
    name: "Transform API Response to MCP ResultDetails"
    stage_type: Transformation
    description: "Converts the API's JSON response into a structpb.Struct for MCP InformResult.ResultDetails."
    dependencies:
      - check-api-response-status # Only on success path
    inputs:
      - data_element_id: internal_api_response_bytes
        as_name: api_response_body
    outputs:
      - data_element_id: sads_output_struct
    transform_engine: custom_code_snippet # Placeholder for JSON to structpb.Struct conversion
    transform_logic:
      language: go_snippet
      code: |
        // var data_map map[string]interface{}
        // json.Unmarshal(api_response_body, &data_map)
        // sads_output_struct, err = structpb.NewStruct(data_map)
        // Handle errors -> proceed to a failure stage
    on_error:
      - error_pattern: "*"
        action: ProceedToStage
        action_params:
          next_stage_id: prepare-resulttransform-failure-response # Specific failure for this step

  # 6. Prepare MCP InformResult message
  - id: prepare-inform-result
    name: "Prepare MCP InformResult"
    stage_type: ActionCall # Using ActionCall to construct an MCP message object
    description: "Constructs the successful MCP InformResult message."
    dependencies:
      - transform-api-response-to-mcp-result
      - init-mcp-service-agent-id # Ensure service agent ID is available
    inputs:
      - data_element_id: original_requester_agent_id
        as_name: receiver_id
      - data_element_id: original_mcp_message_id
        as_name: reply_to_id
      - data_element_id: sads_output_struct
        as_name: result_payload_details
      - data_element_id: mcp_service_agent_id
        as_name: sender_id
    outputs:
      # This stage would internally prepare an MCP message object.
      # For visualization, we might have a DataElement representing the "PreparedMcpMessage"
      # but for actual execution, it might directly call the send action next.
      # Let's assume it creates a data element that the send action consumes.
      - data_element_id: outgoing_mcp_message_object # A conceptual object
        produced_as: mcp_message
    action_type: InternalFunctionCall # Or a specific "ConstructMcpMessage" action_type
    action_details:
      function_name: "mcpHelper.CreateInformResult" # Pseudo-function
      parameter_mappings:
        - arg_name: "senderAgentId"
          source_data_element_id: mcp_service_agent_id
        - arg_name: "receiverAgentId"
          source_data_element_id: original_requester_agent_id
        - arg_name: "inReplyToMessageId"
          source_data_element_id: original_mcp_message_id
        - arg_name: "resultDetails"
          source_data_element_id: sads_output_struct
        - arg_name: "summary"
          static_value: "SADS generation successful." # Can also come from a DataElement
    on_error:
      - error_pattern: "*"
        action: ProceedToStage # Should not fail ideally, but if so, go to generic failure
        action_params:
          next_stage_id: prepare-generic-failure-response


  # --- Failure Handling Stages ---
  # These stages would prepare an `error_details_struct` and then proceed to `prepare-failure-response`

  - id: prepare-extraction-failure-response
    name: "Prepare Extraction Failure Details"
    stage_type: Transformation
    description: "Creates error details for 'natural_language_input' extraction failure."
    outputs:
      - data_element_id: error_details_struct
    transform_engine: static_value # Simplified for example
    transform_logic:
      language: static_map_to_struct
      value:
        error_code: "EXTRACT_NL_FAILED"
        error_message: "Could not extract 'natural_language_input' from task parameters."
    # This stage would then transition to a common "prepare-failure-mcp-message" stage

  - id: prepare-apirequest-build-failure-response
    # Similar to above, for API request construction errors
    # ... (details omitted for brevity) ...
    # Transitions to common failure message prep

  - id: prepare-apicall-failure-response
    name: "Prepare API Call Failure Details"
    stage_type: Transformation
    description: "Creates error details for internal API call failure based on status code or network error."
    dependencies:
      - call-internal-sads-api # Or check-api-response-status if it routes here
    inputs:
      - data_element_id: internal_api_response_status_code
        as_name: status_code
        is_required: false # Might not be present for network errors
      - data_element_id: internal_api_response_bytes # Could contain error details from API
        as_name: response_body
        is_required: false
    outputs:
      - data_element_id: error_details_struct
    transform_engine: custom_code_snippet
    transform_logic:
      language: go_snippet
      code: |
        // Based on status_code and response_body, create a meaningful error struct.
        // error_details_struct = ...
    # Transitions to common failure message prep

  - id: prepare-resulttransform-failure-response
    # Similar, for errors during transformation of API response to MCP result
    # ... (details omitted for brevity) ...

  - id: prepare-generic-failure-response
    # A catch-all if other specific failure preps are not hit
    # ... (details omitted for brevity) ...

  # Common stage to construct the MCP Failure message
  - id: prepare-mcp-failure-message
    name: "Prepare MCP Failure Message"
    stage_type: ActionCall
    description: "Constructs the MCP Failure message using error_details_struct."
    dependencies: # Depends on one of the failure detail prep stages
      # This needs a way to express OR logic or a merge point if multiple failure paths lead here.
      # For simplicity, assume the preceding failure stages set 'error_details_struct'
      # and then this stage is invoked. A real engine needs proper flow control for this.
      # Alternative: Each failure prep stage calls this as a sub-flow or directly transitions to send.
      - prepare-extraction-failure-response # This implies an OR, or the flow routes here
      # - prepare-apicall-failure-response (example of other paths)
    inputs:
      - data_element_id: error_details_struct
        as_name: failure_payload_details
      - data_element_id: mcp_service_agent_id
        as_name: sender_id
      # ... other necessary inputs like original_requester_agent_id, original_mcp_message_id
    outputs:
      - data_element_id: outgoing_mcp_message_object # Same conceptual object as success path
        produced_as: mcp_message
    action_type: InternalFunctionCall # Or "ConstructMcpMessage"
    action_details:
      function_name: "mcpHelper.CreateFailureMessage" # Pseudo-function
      # ... parameter_mappings for failure message ...
    # No on_error here, if this fails, it's a critical flow definition error

  # 7. Send the prepared MCP message (InformResult or Failure)
  - id: send-mcp-response
    name: "Send MCP Response"
    stage_type: ActionCall
    description: "Sends the constructed MCP message back to the original requester."
    dependencies: # Depends on either successful preparation or failure preparation
      - prepare-inform-result
      - prepare-mcp-failure-message # Again, OR logic or routing needed here for a real engine
    inputs:
      - data_element_id: outgoing_mcp_message_object
        as_name: message_to_send
      - data_element_id: original_requester_agent_id # To know where to send it
        as_name: target_agent_id
    action_type: McpMessageSend
    action_details:
      # Details for how McpMessageSend action uses its inputs:
      target_agent_id_data_element: original_requester_agent_id # Redundant if input mapping is clear
      mcp_message_data_element: outgoing_mcp_message_object
    # Error handling for send failure (e.g., client disconnected) could be here.
    # For now, assume it logs and finishes.
